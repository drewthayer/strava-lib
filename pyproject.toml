[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-lib"
version = "0.1.0"
description = "Download Strava activity data to CSV and/or Google Sheets for analysis"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "gspread>=6.0",
    "google-auth>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ imports conftest directly for the gspread fakes.
pythonpath = ["src", "tests"]
